name: actualizar-anuncios

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Crear carpeta data si no existe
        run: mkdir -p data

      - name: Descargar anuncios desde Apps Script
        env:
          ANUNCIOS_URL: ${{ secrets.ANUNCIOS_API_URL }}
        run: |
          set -e

          if [ -z "$ANUNCIOS_URL" ]; then
            echo "ERROR: El secret ANUNCIOS_URL está vacío o no existe."
            exit 1
          fi

          echo "Descargando anuncios..."
          HTTP_CODE=$(curl -L -sS -o data/anuncios.json -w "%{http_code}" "$ANUNCIOS_URL")

          echo "HTTP_CODE=$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: La URL no devolvió 200."
            echo "Contenido recibido:"
            cat data/anuncios.json || true
            exit 1
          fi

          echo "Primeras líneas del archivo descargado:"
          head -n 20 data/anuncios.json || true

      - name: Validar JSON
        run: |
          python - <<'PY'
          import json
          with open("data/anuncios.json", "r", encoding="utf-8") as f:
              json.load(f)
          print("JSON válido")
          PY

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit y push si hay cambios
        run: |
          git add data/anuncios.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Actualizar anuncios"
          git push
