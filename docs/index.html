<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>AMesaPuesta</title>

  <style>
    :root{
      --bg:#f7f4ef;
      --text:#1f1a17;
      --muted:#5b4334;
      --primary:#a40000;
      --primary-dark:#860000;
      --primary-soft:#b80d0d;
      --panel-border:rgba(232,221,210,.78);
      --shadow:0 12px 26px rgba(0,0,0,.10);
      --shadow-soft:0 6px 18px rgba(0,0,0,.06);
      --max-width:1120px;
      --content-width:980px;

      --notice-bg-1:#fbf4e8;
      --notice-bg-2:#f4e6cf;
      --notice-border:#e5cfaa;
      --notice-text:#5a4030;
      --notice-title:#8b0000;
      --notice-link:#7a2200;
      --notice-icon-bg:rgba(139,0,0,.08);
      --notice-dot:#b40000;
    }

    *{
      box-sizing:border-box;
    }

    html{
      -webkit-text-size-adjust:100%;
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      color:var(--text);
      background:
        radial-gradient(circle at top, #ffffff 0%, var(--bg) 46%, #f2ece3 100%);
      min-height:100vh;
    }

    img{
      max-width:100%;
      display:block;
    }

    a{
      color:inherit;
    }

    .page-shell{
      width:min(calc(100% - 28px), var(--max-width));
      margin:0 auto;
      padding:
        max(8px, env(safe-area-inset-top))
        0
        max(18px, env(safe-area-inset-bottom))
        0;
    }

    .hero{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:10px 0 6px;
    }

    .brand-panel{
      width:100%;
      max-width:var(--content-width);
      display:flex;
      flex-direction:column;
      align-items:center;
      background:rgba(255,255,255,.50);
      border:1px solid var(--panel-border);
      border-radius:34px;
      box-shadow:var(--shadow-soft);
      padding:14px 16px 12px;
      backdrop-filter:blur(2px);
    }

    .logo-wrap{
      position:relative;
      width:min(100%, 470px);
      aspect-ratio:1 / 1;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto;
    }

    .arc{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      overflow:visible;
      pointer-events:none;
    }

    .arc-text{
      fill:#1e1a17;
      font-size:24px;
      font-weight:700;
      letter-spacing:2.2px;
      text-transform:uppercase;
    }

    .logo{
      width:min(62%, 300px);
      height:auto;
      object-fit:contain;
      margin-top:12px;
      background:transparent;
      filter:drop-shadow(0 6px 12px rgba(0,0,0,.14));
    }

    .slogan{
      margin-top:-18px;
      margin-bottom:4px;
      text-align:center;
      color:var(--muted);
      font-size:clamp(18px, 2vw, 28px);
      line-height:1.15;
      font-weight:700;
      max-width:100%;
      white-space:nowrap;
    }

    .menu-principal{
      width:100%;
      max-width:860px;
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:16px;
      margin:10px auto 0;
    }

    .boton-menu{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:64px;
      padding:14px 16px;
      border-radius:18px;
      text-decoration:none;
      color:#fff;
      background:linear-gradient(180deg, var(--primary-soft) 0%, var(--primary) 45%, var(--primary-dark) 100%);
      box-shadow:var(--shadow);
      font-size:20px;
      font-weight:700;
      line-height:1.2;
      text-align:center;
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
      -webkit-tap-highlight-color:transparent;
    }

    .boton-menu svg{
      width:20px;
      height:20px;
      flex:0 0 20px;
    }

    .boton-menu:hover{
      transform:translateY(-2px);
      box-shadow:0 14px 24px rgba(0,0,0,.14);
      filter:brightness(1.02);
    }

    .boton-menu:active{
      transform:scale(.985);
    }

    .boton-menu--anuncios{
      grid-column:1 / -1;
      width:min(100%, 380px);
      justify-self:center;
    }

    .boton-menu--anuncios-activo{
      box-shadow:
        0 12px 26px rgba(0,0,0,.10),
        0 0 0 2px rgba(243,221,184,.9);
    }

    .badge-anuncios{
      position:absolute;
      top:10px;
      right:12px;
      width:11px;
      height:11px;
      border-radius:50%;
      background:var(--notice-dot);
      box-shadow:0 0 0 3px rgba(255,255,255,.95);
    }

    .aviso-home{
      width:100%;
      max-width:var(--content-width);
      margin:12px auto 0;
      display:flex;
      align-items:center;
      gap:16px;
      padding:14px 16px;
      border-radius:24px;
      background:linear-gradient(180deg, var(--notice-bg-1) 0%, var(--notice-bg-2) 100%);
      color:var(--notice-text);
      border:1px solid var(--notice-border);
      box-shadow:var(--shadow-soft);
    }

    .aviso-home[hidden]{
      display:none !important;
    }

    .aviso-home-icono{
      width:54px;
      height:54px;
      border-radius:50%;
      background:var(--notice-icon-bg);
      color:var(--notice-title);
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 54px;
    }

    .aviso-home-icono svg{
      width:24px;
      height:24px;
    }

    .aviso-home-texto{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:3px;
      flex:1;
    }

    .aviso-home-texto strong{
      font-size:18px;
      line-height:1.1;
      color:var(--notice-title);
    }

    .aviso-home-texto span{
      font-size:14px;
      line-height:1.3;
      color:var(--notice-text);
    }

    .aviso-home-link{
      flex:0 0 auto;
      color:var(--notice-link);
      font-size:17px;
      font-weight:700;
      text-decoration:underline;
      white-space:nowrap;
      padding-left:6px;
    }

    @media (max-width: 980px){
      .brand-panel{
        padding:16px 14px 12px;
      }

      .menu-principal{
        grid-template-columns:repeat(2, minmax(0, 1fr));
        max-width:640px;
      }

      .slogan{
        white-space:normal;
        font-size:clamp(20px, 3vw, 30px);
        margin-top:-14px;
      }

      .boton-menu--anuncios{
        grid-column:1 / -1;
        width:100%;
        max-width:none;
      }
    }

    @media (max-width: 640px){
      .page-shell{
        width:min(calc(100% - 18px), 100%);
      }

      .hero{
        padding-top:10px;
        padding-bottom:6px;
      }

      .brand-panel{
        border-radius:24px;
        padding:14px 12px 12px;
      }

      .logo-wrap{
        width:min(100%, 340px);
        margin-top:-10px;
        margin-bottom:0;
      }

      .arc-text{
        font-size:22px;
        letter-spacing:1.3px;
      }

      .arc{
        transform: translateY(6px);
      }

      .logo{
        width:min(64%, 215px);
        margin-top:4px;
      }

      .slogan{
        font-size:clamp(15px, 4.8vw, 21px);
        line-height:1.18;
        margin-top:-50px;
        margin-bottom:12px;
        padding:0 4px;
        white-space:normal;
      }

      .menu-principal{
        gap:12px;
        margin:4px auto 0;
      }

      .boton-menu{
        min-height:54px;
        padding:12px 10px;
        border-radius:15px;
        font-size:16px;
        gap:7px;
      }

      .boton-menu svg{
        width:17px;
        height:17px;
        flex-basis:17px;
      }

      .badge-anuncios{
        top:8px;
        right:10px;
        width:10px;
        height:10px;
      }

      .aviso-home{
        margin-top:12px;
        gap:10px;
        padding:12px 12px;
        border-radius:20px;
      }

      .aviso-home-icono{
        width:44px;
        height:44px;
        flex-basis:44px;
      }

      .aviso-home-icono svg{
        width:20px;
        height:20px;
      }

      .aviso-home-texto strong{
        font-size:16px;
      }

      .aviso-home-texto span{
        font-size:13px;
        line-height:1.25;
      }

      .aviso-home-link{
        font-size:15px;
        padding-left:2px;
      }
    }

    @media (max-width: 390px){
      .logo-wrap{
        width:min(100%, 300px);
      }

      .arc-text{
        font-size:15px;
        letter-spacing:1px;
      }

      .logo{
        width:min(58%, 175px);
        margin-top:8px;
      }

      .slogan{
        margin-top:-18px;
      }

      .menu-principal{
        grid-template-columns:1fr;
        max-width:320px;
      }

      .boton-menu{
        min-height:52px;
        font-size:16px;
      }

      .boton-menu--anuncios{
        grid-column:auto;
        width:100%;
      }

      .aviso-home{
        align-items:flex-start;
      }

      .aviso-home-link{
        align-self:center;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <main class="hero">
      <section class="brand-panel">
        <div class="logo-wrap">
          <svg class="arc" viewBox="0 0 400 400" aria-hidden="true">
            <defs>
              <path id="topArc" d="M 70 200 A 130 130 0 0 1 330 200" />
            </defs>

            <text class="arc-text">
              <textPath href="#topArc" startOffset="50%" text-anchor="middle">
                COFRADÍA A MESA PUESTA
              </textPath>
            </text>
          </svg>

          <img
            class="logo"
            src="./Fotos/logo-cangrejo.png"
            alt="Logo AMesaPuesta"
          />
        </div>

        <p class="slogan">A mesa puesta… y el vaso lleno desde 2022</p>

        <div class="menu-principal">
          <a href="cofrades.html" class="boton-menu">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 11c1.66 0 3-1.79 3-4s-1.34-4-3-4-3 1.79-3 4 1.34 4 3 4zm-8 0c1.66 0 3-1.79 3-4S9.66 3 8 3 5 4.79 5 7s1.34 4 3 4zm0 2c-2.67 0-8 1.34-8 4v3h10v-3c0-1.02.39-1.97 1.02-2.78C10.21 13.44 8.94 13 8 13zm8 0c-.94 0-2.21.44-3.02 1.22C13.61 15.03 14 15.98 14 17v3h10v-3c0-2.66-5.33-4-8-4z"/>
            </svg>
            Cofrades
          </a>

          <a href="restaurantes.html" class="boton-menu">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 9H9V2H7v7H5V2H3v7c0 2.21 1.79 4 4 4v9h2v-9c2.21 0 4-1.79 4-4V2h-2v7zm4-7v20h2v-8h3V2h-5z"/>
            </svg>
            Restaurantes
          </a>

          <a href="himno.html" class="boton-menu">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
            </svg>
            Himno
          </a>

          <a href="estatutos.html" class="boton-menu">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1 21h12v2H1zM5.24 8.17l4.59 4.59 2.12-2.12-4.59-4.59L5.24 8.17zm6.01-6.01l4.59 4.59 2.12-2.12-4.59-4.59-2.12 2.12zM3.12 10.29l10.59 10.59 2.12-2.12L5.24 8.17 3.12 10.29z"/>
            </svg>
            Estatutos
          </a>

          <a href="anuncios.html" class="boton-menu boton-menu--anuncios" id="botonAnuncios">
            <span id="badgeAnuncios" class="badge-anuncios" hidden></span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 10v4c0 .55.45 1 1 1h3l4 3V6L7 9H4c-.55 0-1 .45-1 1zm13.5 2c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zm-2.5-9.5v2.06c2.89.86 5 3.54 5 6.44s-2.11 5.58-5 6.44v2.06c4.01-.91 7-4.49 7-8.5s-2.99-7.59-7-8.5z"/>
            </svg>
            Tablón de anuncios
          </a>
        </div>
      </section>
    </main>

    <div id="avisoAnuncios" class="aviso-home" hidden>
      <div class="aviso-home-icono">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10v4c0 .55.45 1 1 1h3l4 3V6L7 9H4c-.55 0-1 .45-1 1zm13.5 2c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zm-2.5-9.5v2.06c2.89.86 5 3.54 5 6.44s-2.11 5.58-5 6.44v2.06c4.01-.91 7-4.49 7-8.5s-2.99-7.59-7-8.5z"/>
        </svg>
      </div>

      <div class="aviso-home-texto">
        <strong id="tituloAvisoAnuncios">Nuevo anuncio destacado</strong>
        <span id="textoAvisoAnuncios">Hay un anuncio importante en el tablón.</span>
      </div>

      <a href="anuncios.html" class="aviso-home-link">Ver</a>
    </div>
  </div>

  <script>
    (async function () {
      const aviso = document.getElementById("avisoAnuncios");
      const badge = document.getElementById("badgeAnuncios");
      const botonAnuncios = document.getElementById("botonAnuncios");
      const tituloAviso = document.getElementById("tituloAvisoAnuncios");
      const textoAviso = document.getElementById("textoAvisoAnuncios");

      function fechaValida(fecha) {
        return fecha && !isNaN(new Date(fecha).getTime());
      }

      function estaCaducado(fechaFin) {
        if (!fechaValida(fechaFin)) return false;

        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);

        const fin = new Date(fechaFin);
        fin.setHours(23, 59, 59, 999);

        return fin < hoy;
      }

      function esPublicable(a) {
        if (a.visible === false) return false;
        if (estaCaducado(a.fechaFin)) return false;

        if (fechaValida(a.fechaPublicacion)) {
          const hoy = new Date();
          hoy.setHours(23, 59, 59, 999);

          const publicacion = new Date(a.fechaPublicacion);
          publicacion.setHours(0, 0, 0, 0);

          if (publicacion > hoy) return false;
        }

        return true;
      }

      function obtenerTimestamp(a) {
        if (fechaValida(a.fecha)) return new Date(a.fecha).getTime();
        return 0;
      }

      try {
        const res = await fetch("./anuncios.json?v=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;

        const data = await res.json();
        const anuncios = Array.isArray(data.anuncios) ? data.anuncios : [];

        const destacados = anuncios
          .filter(a => esPublicable(a) && a.destacado === true)
          .sort((a, b) => obtenerTimestamp(b) - obtenerTimestamp(a));

        if (destacados.length > 0) {
          const principal = destacados[0];

          aviso.hidden = false;
          badge.hidden = false;
          botonAnuncios.classList.add("boton-menu--anuncios-activo");

          tituloAviso.textContent = "Nuevo anuncio destacado";
          textoAviso.textContent = principal.titulo
            ? principal.titulo
            : "Hay un anuncio importante en el tablón.";
        }
      } catch (e) {
        console.error(e);
      }
    })();
  </script>
</body>
</html>
