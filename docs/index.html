<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AMesaPuesta</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="hero">

    <div class="logo-wrap">

      <svg class="arc" viewBox="0 0 400 400">
        <defs>
          <!-- Arco superior más abierto -->
          <path id="topArc" d="M 5 110 A 260 260 0 0 1 395 110" />
        </defs>

        <text class="arc-text">
          <textPath href="#topArc" startOffset="50%" text-anchor="middle">
            COFRADÍA A MESA PUESTA
          </textPath>
        </text>
      </svg>

      <img
        class="logo"
        src="./Fotos/logo-cangrejo.png"
        alt="Logo AMesaPuesta"
      />

    </div>

    <p class="slogan">
      A mesa puesta… y el vaso lleno desde 2022
    </p>

  </main>
</body>
</html>
