<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AMesaPuesta</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="hero">

    <div class="logo-wrap" aria-label="Cofradía A Mesa Puesta">
      <!-- Texto curvo -->
      <svg class="arc" viewBox="0 0 300 300" role="img" aria-label="Cofradía A Mesa Puesta">
        <defs>
          <!-- Arco superior -->
          <path id="topArc" d="M 40 165 A 110 110 0 0 1 260 165" />
        </defs>

        <text class="arc-text">
          <textPath href="#topArc" startOffset="50%" text-anchor="middle">
            Cofradía A Mesa Puesta
          </textPath>
        </text>
      </svg>

      <!-- Logo -->
      <img
        class="logo"
        src="./Fotos/logo-cangrejo.png"
        alt="Logo AMesaPuesta"
      />
    </div>

    <p class="slogan">A mesa puesta… y el vaso lleno desde 2022</p>

  </main>
</body>
</html>
