<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f8f5f0" />
  <title>Mapa de restaurantes | Cofradía A Mesa Puesta</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    :root{
      color-scheme: light;
      --bg:#f8f5f0;
      --card:#ffffff;
      --ink:#1f1f1f;
      --muted:#6b7280;
      --accent:#8b0000;
      --border:#e7e2d9;
      --shadow:0 10px 28px rgba(0,0,0,.08);
      --radius:18px;
      --max:1200px;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    body{
      min-height:100vh;
    }

    .wrap{
      width:min(var(--max), calc(100% - 24px));
      margin:0 auto;
      padding:22px 0 30px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .titlebox h1{
      margin:0;
      font-size:clamp(1.7rem, 2.8vw, 2.4rem);
      line-height:1.05;
      color:var(--accent);
    }

    .titlebox p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:.98rem;
    }

    .back-btn{
      appearance:none;
      border:1px solid var(--border);
      background:#fff;
      color:var(--ink);
      padding:10px 16px;
      border-radius:999px;
      font-weight:700;
      text-decoration:none;
      box-shadow:var(--shadow);
      transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      white-space:nowrap;
    }

    .back-btn:hover{
      transform:translateY(-1px);
      border-color:#d9d1c6;
      box-shadow:0 12px 28px rgba(0,0,0,.10);
    }

    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel-head{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      padding:16px 18px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg,#fff,#fcfaf7);
      flex-wrap:wrap;
    }

    .panel-head strong{
      font-size:1rem;
    }

    .legend{
      color:var(--muted);
      font-size:.92rem;
    }

    #map{
      width:100%;
      height:72vh;
      min-height:480px;
      background:#eee;
    }

    .leaflet-popup-content{
      margin:12px 14px;
      line-height:1.45;
      font-size:.95rem;
    }

    .popup-title{
      font-weight:800;
      color:var(--accent);
      margin-bottom:6px;
      font-size:1rem;
    }

    .popup-line{
      color:var(--ink);
      margin:4px 0;
    }

    .popup-muted{
      color:var(--muted);
      font-size:.92rem;
    }

    .footer-note{
      margin-top:12px;
      color:var(--muted);
      font-size:.92rem;
      text-align:center;
    }

    @media (max-width: 768px){
      .wrap{
        width:min(var(--max), calc(100% - 16px));
        padding-top:14px;
      }

      .topbar{
        align-items:flex-start;
      }

      #map{
        height:68vh;
        min-height:420px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div class="titlebox">
        <h1>Mapa de restaurantes</h1>
        <p>Ubicación de todos los restaurantes visitados por la Cofradía</p>
      </div>

      <a class="back-btn" href="index.html">Volver</a>
    </div>

    <section class="panel">
      <div class="panel-head">
        <strong>Restaurantes de la Cofradía</strong>
        <div class="legend">Pulsa en un marcador para ver la información</div>
      </div>

      <div id="map"></div>
    </section>

    <p class="footer-note">
      Consejo: centra el mapa en Galicia o en vuestra zona habitual para que quede más bonito.
    </p>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    const restaurantes = [
      {
        nombre: "Casa Pepe",
        fecha: "2024-03-16",
        direccion: "Calle Mayor 12, Pontevedra",
        lat: 42.4318,
        lng: -8.6444,
        menu: "Cocido, vino tinto y filloas"
      },
      {
        nombre: "Mesón O Lagar",
        fecha: "2024-06-22",
        direccion: "Praza de España 5, Vigo",
        lat: 42.2406,
        lng: -8.7207,
        menu: "Pulpo, churrasco y postre casero"
      },
      {
        nombre: "A Taberna do Porto",
        fecha: "2025-01-18",
        direccion: "Av. da Mariña 20, Vilagarcía",
        lat: 42.5963,
        lng: -8.7659,
        menu: "Mariscada y tarta de Santiago"
      }
    ];

    const map = L.map("map", {
      scrollWheelZoom: true
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const bounds = [];

    restaurantes.forEach(r => {
      if (typeof r.lat !== "number" || typeof r.lng !== "number") return;

      const marker = L.marker([r.lat, r.lng]).addTo(map);

      marker.bindPopup(`
        <div class="popup-title">${r.nombre}</div>
        <div class="popup-line"><strong>Fecha:</strong> ${formateaFecha(r.fecha)}</div>
        <div class="popup-line"><strong>Dirección:</strong> ${r.direccion}</div>
        ${r.menu ? `<div class="popup-line"><strong>Menú:</strong> ${r.menu}</div>` : ""}
      `);

      bounds.push([r.lat, r.lng]);
    });

    if (bounds.length === 1) {
      map.setView(bounds[0], 14);
    } else if (bounds.length > 1) {
      map.fitBounds(bounds, { padding: [40, 40] });
    } else {
      map.setView([42.4338, -8.6480], 10);
    }

    function formateaFecha(fechaISO){
      if (!fechaISO) return "—";
      const d = new Date(fechaISO);
      if (Number.isNaN(d.getTime())) return fechaISO;

      return d.toLocaleDateString("es-ES", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }
  </script>
</body>
</html>
