<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f8f5f0" />
  <title>Mapa de restaurantes | Cofradía A Mesa Puesta</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    :root{
      --bg:#f8f5f0;
      --card:#ffffff;
      --ink:#1f1f1f;
      --muted:#6b7280;
      --accent:#8b0000;
      --border:#e7e2d9;
      --shadow:0 10px 28px rgba(0,0,0,.08);
      --radius:18px;
      --max:1200px;
    }

    body{
      margin:0;
      font-family:system-ui;
      background:var(--bg);
    }

    .wrap{
      width:min(var(--max), calc(100% - 24px));
      margin:auto;
      padding:20px 0;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
    }

    h1{
      margin:0;
      color:var(--accent);
    }

    .back-btn{
      background:#fff;
      border:1px solid var(--border);
      padding:10px 16px;
      border-radius:999px;
      text-decoration:none;
      font-weight:600;
      box-shadow:var(--shadow);
    }

    .panel{
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    #map{
      height:75vh;
      min-height:450px;
    }

    .popup-title{
      font-weight:800;
      color:var(--accent);
      margin-bottom:6px;
    }
  </style>
</head>

<body>
  <main class="wrap">

    <div class="topbar">
      <h1>Mapa de restaurantes</h1>
      <a class="back-btn" href="restaurantes.html">Volver</a>
    </div>

    <div class="panel">
      <div id="map"></div>
    </div>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map("map");

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19
    }).addTo(map);

    // 🔥 AQUÍ ESTÁ LA CLAVE: cargar tu JSON real
    fetch("restaurantes.json")
      .then(res => res.json())
      .then(data => {

        const restaurantes = data.restaurantes;
        const bounds = [];

        restaurantes.forEach(r => {

          if (!r.latitud || !r.longitud) return;

          const lat = parseFloat(r.latitud);
          const lng = parseFloat(r.longitud);

          if (isNaN(lat) || isNaN(lng)) return;

          const marker = L.marker([lat, lng]).addTo(map);

          marker.bindPopup(`
            <div class="popup-title">${r.nombre}</div>
            <div><strong>Fecha:</strong> ${formateaFecha(r.fecha)}</div>
            <div><strong>Dirección:</strong> ${r.direccion}</div>
            ${r.precio ? `<div><strong>Precio:</strong> ${r.precio}</div>` : ""}
            ${r.descripcion ? `<div>${r.descripcion}</div>` : ""}
          `);

          bounds.push([lat, lng]);
        });

        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [40, 40] });
        } else {
          map.setView([42.4338, -8.648], 10);
        }

      })
      .catch(err => {
        console.error("Error cargando JSON:", err);
      });

    function formateaFecha(fechaISO){
      if (!fechaISO) return "—";
      const d = new Date(fechaISO);
      if (isNaN(d)) return fechaISO;

      return d.toLocaleDateString("es-ES");
    }
  </script>

</body>
</html>
