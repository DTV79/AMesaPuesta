<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurantes</title>
<link rel="stylesheet" href="styles.css">

<style>
  :root{
    --bg:#f8f5f0;
    --card:#ffffff;
    --ink:#1f1f1f;
    --muted:#6b7280;
    --accent:#8b0000;
    --border:#e5e7eb;
    --shadow:0 8px 24px rgba(0,0,0,.08);
    --radius:18px;
  }

  body{
    margin:0;
    font-family:system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
    background:var(--bg);
    color:var(--ink);
  }

  .container{
    width:min(1100px,92vw);
    margin:20px auto 60px;
    padding:0;
  }

  .volver{
    display:inline-block;
    background:#8b0000;
    color:white;
    padding:8px 16px;
    border-radius:6px;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    margin-bottom:24px;
  }

  .volver:hover{
    opacity:.9;
  }

  .filtros{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:10px;
  }

  .buscador-wrap{
    position:relative;
    width:100%;
    min-width:0;
  }

  .buscador-icono{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    font-size:14px;
    pointer-events:none;
  }

  .buscador{
    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,0.06);
    outline:none;
    padding:12px 16px 12px 38px;
    font-size:15px;
  }

  .fechas-wrap{
    display:flex;
    width:100%;
    gap:10px;
  }

  .fecha-box{
    flex:1 1 0;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .fecha-box label{
    font-size:12px;
    color:var(--muted);
    font-weight:600;
  }

  .fecha-input{
    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,0.06);
    outline:none;
    padding:9px 6px;
    font-size:11px;
    appearance:auto;
    -webkit-appearance:auto;
  }

  .buscador:focus,
  .fecha-input:focus{
    border-color:rgba(139,0,0,.45);
  }

  .btn-limpiar{
    background:transparent;
    border:1px solid #d8caca;
    color:var(--muted);
    border-radius:8px;
    padding:8px 10px;
    font-size:12px;
    cursor:pointer;
    font-weight:500;
    white-space:nowrap;
    transition:.2s;
    align-self:flex-start;
  }

  .btn-limpiar:hover{
    background:#faf7f7;
    color:#8b0000;
    border-color:#c9b1b1;
  }

  .contador{
    margin-bottom:22px;
    color:var(--muted);
    font-size:14px;
  }

  .lista-restaurantes{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:20px;
  }

  .restaurante{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    border:1px solid var(--border);
  }

  .restaurante-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:12px;
  }

  .restaurante h2{
    margin:0;
    font-size:20px;
    color:var(--accent);
    line-height:1.2;
  }

  .resenas{
    display:inline-block;
    background:#faf3f3;
    color:var(--accent);
    border:1px solid rgba(139,0,0,.18);
    border-radius:999px;
    padding:6px 10px;
    font-weight:700;
    font-size:13px;
    white-space:nowrap;
    letter-spacing:1px;
  }

  .resumen p{
    margin:6px 0;
    font-size:14px;
    line-height:1.45;
  }

  .descripcion{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #f0eeee;
  }

  .descripcion p{
    margin:6px 0;
    font-size:14px;
    line-height:1.5;
  }

  .autor{
    color:var(--muted);
    font-style:italic;
  }

  .web-link{
    color:var(--accent);
    text-decoration:none;
    word-break:break-word;
  }

  .web-link:hover{
    text-decoration:underline;
  }

  .btn-detalles{
    margin-top:12px;
    background:#8b0000;
    color:white;
    border:none;
    padding:9px 14px;
    border-radius:8px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }

  .btn-detalles:hover{
    opacity:.92;
  }

  .detalles{
    display:none;
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }

  .detalles.abierto{
    display:block;
  }

  .detalle-box{
    background:#fcfbfb;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:12px;
  }

  .detalle-box h3{
    margin:0 0 8px 0;
    color:var(--accent);
    font-size:15px;
  }

  .detalle-box ul{
    margin:0;
    padding-left:18px;
  }

  .detalle-box li,
  .detalle-box p{
    margin:5px 0;
    font-size:14px;
    line-height:1.45;
  }

  .muted{
    color:var(--muted);
  }

  .mensaje{
    grid-column:1 / -1;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    border:1px solid var(--border);
    font-size:15px;
  }

  @media (max-width: 800px){
    .lista-restaurantes{
      grid-template-columns:1fr;
    }
  }
</style>
</head>

<body>

<header class="page-header">
  <h1>
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="white" viewBox="0 0 24 24">
      <path d="M11 9H9V2H7v7H5V2H3v7c0 2.21 1.79 4 4 4v9h2v-9c2.21 0 4-1.79 4-4V2h-2v7zm4-7v20h2v-8h3V2h-5z"/>
    </svg>
    Restaurantes
  </h1>
</header>

<div class="container">
  <a href="index.html" class="volver">← Volver</a>

  <div class="filtros">
    <div class="buscador-wrap">
      <span class="buscador-icono">🔎</span>
      <input
        type="search"
        id="buscador"
        class="buscador"
        placeholder="Buscar por restaurante, lugar, organizador o fecha..."
      >
    </div>

    <div class="fechas-wrap">
      <div class="fecha-box">
        <label for="fecha-desde">Desde</label>
        <input
          type="date"
          id="fecha-desde"
          class="fecha-input"
        >
      </div>

      <div class="fecha-box">
        <label for="fecha-hasta">Hasta</label>
        <input
          type="date"
          id="fecha-hasta"
          class="fecha-input"
        >
      </div>
    </div>

    <button id="limpiar" class="btn-limpiar" type="button">
      Limpiar filtros
    </button>
  </div>

  <div id="contador" class="contador">Cargando restaurantes…</div>

  <div id="lista-restaurantes" class="lista-restaurantes">
    <div class="mensaje">Cargando restaurantes…</div>
  </div>
</div>

<script>
  let TODOS_LOS_RESTAURANTES = [];

  function formatearFecha(fecha){
    if(!fecha) return "—";

    const f = new Date(fecha);
    if(isNaN(f)) return fecha;

    const dia = String(f.getDate()).padStart(2,"0");
    const mes = String(f.getMonth() + 1).padStart(2,"0");
    const año = f.getFullYear();

    return `${dia}/${mes}/${año}`;
  }

  function listaAHTML(lista){
    if(!Array.isArray(lista) || lista.length === 0){
      return '<p class="muted">Sin datos</p>';
    }
    return `<ul>${lista.map(item => `<li>${item}</li>`).join("")}</ul>`;
  }

  function textoSeguro(valor){
    return (valor !== undefined && valor !== null && String(valor).trim() !== "") ? valor : "—";
  }

  function formatearPrecio(valor){
    if(valor === undefined || valor === null || valor === "") return "—";

    const numero = Number(valor);

    if(isNaN(numero)) return valor;

    return numero.toLocaleString("es-ES", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + " €";
  }

  function renderResenas(resenas){
    if(!resenas || String(resenas).trim() === "") return "Sin reseña";
    return String(resenas).trim();
  }

  function crearFicha(rest, index){
    const web = rest.web && String(rest.web).trim() !== ""
      ? `<a class="web-link" href="${rest.web}" target="_blank" rel="noopener noreferrer">${rest.web}</a>`
      : "—";

    const descripcion = rest.descripcion && String(rest.descripcion).trim() !== ""
      ? rest.descripcion
      : "Sin descripción";

    const autor = rest.autor && String(rest.autor).trim() !== ""
      ? rest.autor
      : "Sin autor";

    return `
      <div class="restaurante">
        <div class="restaurante-top">
          <h2>${textoSeguro(rest.nombre)}</h2>
          <div class="resenas">${renderResenas(rest.resenas)}</div>
        </div>

        <div class="resumen">
          <p><b>Fecha:</b> ${formatearFecha(rest.fecha)}</p>
          <p><b>Dirección:</b> ${textoSeguro(rest.direccion)}</p>
          <p><b>Teléfono:</b> ${textoSeguro(rest.telefono)}</p>
          <p><b>Web:</b> ${web}</p>
        </div>

        <div class="descripcion">
          <p><b>Descripción:</b> ${descripcion}</p>
          <p class="autor"><b>Autor:</b> ${autor}</p>
        </div>

        <button class="btn-detalles" onclick="toggleDetalles(${index})" id="btn-${index}">
          Ver más
        </button>

        <div class="detalles" id="detalles-${index}">
          <div class="detalle-box">
            <h3>Organizadores</h3>
            ${listaAHTML(rest.organizadores)}
          </div>

          <div class="detalle-box">
            <h3>Entrantes</h3>
            ${listaAHTML(rest.entrantes)}
          </div>

          <div class="detalle-box">
            <h3>Platos principales</h3>
            ${listaAHTML(rest.platos_principales)}
          </div>

          <div class="detalle-box">
            <h3>Postres</h3>
            ${listaAHTML(rest.postres)}
          </div>

          <div class="detalle-box">
            <h3>Bebidas</h3>
            ${listaAHTML(rest.bebidas)}
          </div>

          <div class="detalle-box">
            <h3>Precio</h3>
            <p><b>${formatearPrecio(rest.precio)}</b></p>
          </div>

          <div class="detalle-box">
            <h3>Asistieron</h3>
            ${listaAHTML(rest.asistieron)}
          </div>

          <div class="detalle-box">
            <h3>No asistieron</h3>
            ${listaAHTML(rest.no_asistieron)}
          </div>
        </div>
      </div>
    `;
  }

  function toggleDetalles(index){
    const detalles = document.getElementById(`detalles-${index}`);
    const boton = document.getElementById(`btn-${index}`);

    if(detalles.classList.contains("abierto")){
      detalles.classList.remove("abierto");
      boton.textContent = "Ver más";
    } else {
      detalles.classList.add("abierto");
      boton.textContent = "Ver menos";
    }
  }

  function textoBusqueda(rest){
    const nombre = (rest.nombre || "").toLowerCase();
    const direccion = (rest.direccion || "").toLowerCase();
    const organizadores = Array.isArray(rest.organizadores) ? rest.organizadores.join(" ").toLowerCase() : "";
    const fechaOriginal = (rest.fecha || "").toLowerCase();
    const fechaFormateada = formatearFecha(rest.fecha).toLowerCase();

    return `${nombre} ${direccion} ${organizadores} ${fechaOriginal} ${fechaFormateada}`;
  }

  function fechaValida(fechaStr){
    if(!fechaStr) return null;
    const f = new Date(fechaStr);
    if(isNaN(f)) return null;
    f.setHours(0,0,0,0);
    return f;
  }

  function restauranteDentroDeRango(rest, desde, hasta){
    if(!rest.fecha) return false;

    const fechaRest = fechaValida(rest.fecha);
    if(!fechaRest) return false;

    if(desde && fechaRest < desde) return false;
    if(hasta && fechaRest > hasta) return false;

    return true;
  }

  function pintarRestaurantes(lista){
    const contenedor = document.getElementById("lista-restaurantes");
    const contador = document.getElementById("contador");

    contador.textContent = `Mostrando ${lista.length} restaurante${lista.length === 1 ? "" : "s"}`;

    if(lista.length === 0){
      contenedor.innerHTML = `<div class="mensaje">No hay restaurantes que coincidan con la búsqueda.</div>`;
      return;
    }

    contenedor.innerHTML = lista
      .sort((a, b) => new Date(b.fecha) - new Date(a.fecha))
      .map((rest, index) => crearFicha(rest, index))
      .join("");
  }

  function aplicarFiltros(){
    const q = document.getElementById("buscador").value.trim().toLowerCase();
    const desde = fechaValida(document.getElementById("fecha-desde").value);
    const hasta = fechaValida(document.getElementById("fecha-hasta").value);

    const filtrados = TODOS_LOS_RESTAURANTES.filter(rest => {
      const coincideTexto = q === "" || textoBusqueda(rest).includes(q);
      const coincideFecha = (!desde && !hasta) || restauranteDentroDeRango(rest, desde, hasta);
      return coincideTexto && coincideFecha;
    });

    pintarRestaurantes(filtrados);
  }

  fetch("restaurantes.json?v=" + Date.now(), { cache: "no-store" })
    .then(res => {
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(data => {
      TODOS_LOS_RESTAURANTES = Array.isArray(data.restaurantes) ? data.restaurantes : [];
      pintarRestaurantes(TODOS_LOS_RESTAURANTES);

      document.getElementById("buscador").addEventListener("input", aplicarFiltros);
      document.getElementById("fecha-desde").addEventListener("change", aplicarFiltros);
      document.getElementById("fecha-hasta").addEventListener("change", aplicarFiltros);

      document.getElementById("limpiar").addEventListener("click", () => {
        document.getElementById("buscador").value = "";
        document.getElementById("fecha-desde").value = "";
        document.getElementById("fecha-hasta").value = "";
        pintarRestaurantes(TODOS_LOS_RESTAURANTES);
      });
    })
    .catch(error => {
      document.getElementById("contador").textContent = "Error al cargar restaurantes";
      document.getElementById("lista-restaurantes").innerHTML =
        `<div class="mensaje">❌ Error cargando restaurantes: ${error.message}</div>`;
    });
</script>

</body>
</html>
