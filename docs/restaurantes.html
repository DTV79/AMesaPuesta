<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurantes</title>
<link rel="stylesheet" href="styles.css">

<style>
  :root{
    --bg:#f8f5f0;
    --card:#ffffff;
    --ink:#1f1f1f;
    --muted:#6b7280;
    --accent:#8b0000;
    --border:#e5e7eb;
    --shadow:0 8px 24px rgba(0,0,0,.08);
    --radius:18px;
  }

  body{
    margin:0;
    font-family:system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
    background:var(--bg);
    color:var(--ink);
  }

  .page-header{
    background:#8b0000;
    color:white;
    padding:30px;
    text-align:center;
  }

  .page-header h1{
    margin:0;
    font-size:28px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
  }

  .container{
    width:min(1100px,92vw);
    margin:20px auto 60px;
    padding:0;
  }

  .volver{
    display:inline-block;
    background:#8b0000;
    color:white;
    padding:8px 16px;
    border-radius:6px;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    margin-bottom:24px;
  }

  .volver:hover{
    opacity:.9;
  }

  .restaurante{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
  }

  .restaurante h2{
    margin-top:0;
    margin-bottom:14px;
    font-size:22px;
  }

  .restaurante p{
    margin:10px 0;
    font-size:14px;
  }
</style>
</head>

<body>

<header class="page-header">
  <h1>
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="white" viewBox="0 0 24 24">
      <path d="M11 9H9V2H7v7H5V2H3v7c0 2.21 1.79 4 4 4v9h2v-9c2.21 0 4-1.79 4-4V2h-2v7zm4-7v20h2v-8h3V2h-5z"/>
    </svg>
    Restaurantes
  </h1>
</header>

<div class="container">

  <a href="index.html" class="volver">← Volver</a>

  <div class="restaurante">
    <h2>Restaurante Casa Paco</h2>
    <p><b>Fecha:</b> 15/02/2026</p>
    <p><b>Dirección:</b> Calle Mayor 12, Vigo</p>
  </div>

  <div class="restaurante">
    <h2>Mesón El Buen Comer</h2>
    <p><b>Fecha:</b> 12/01/2026</p>
    <p><b>Dirección:</b> Plaza España 4, Pontevedra</p>
  </div>

  <div class="restaurante">
    <h2>La Parrilla del Puerto</h2>
    <p><b>Fecha:</b> 20/12/2025</p>
    <p><b>Dirección:</b> Avenida del Mar 8, Baiona</p>
  </div>

</div>

</body>
</html>
