<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurantes</title>
<link rel="stylesheet" href="styles.css">

<style>
  :root{
    --bg:#f8f5f0;
    --card:#ffffff;
    --ink:#1f1f1f;
    --muted:#6b7280;
    --accent:#8b0000;
    --border:#e5e7eb;
    --shadow:0 8px 24px rgba(0,0,0,.08);
    --radius:18px;
  }

  body{
    margin:0;
    font-family:system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
    background:var(--bg);
    color:var(--ink);
  }

  .page-header{
    background:#8b0000;
    color:white;
    padding:30px;
    text-align:center;
  }

  .page-header h1{
    margin:0;
    font-size:28px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
  }

  .container{
    width:min(1100px,92vw);
    margin:20px auto 60px;
    padding:0;
  }

  .volver{
    display:inline-block;
    background:#8b0000;
    color:white;
    padding:8px 16px;
    border-radius:6px;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    margin-bottom:24px;
  }

  .volver:hover{
    opacity:.9;
  }

  .lista-restaurantes{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:20px;
  }

  .restaurante{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    border:1px solid var(--border);
  }

  .restaurante-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:12px;
  }

  .restaurante h2{
    margin:0;
    font-size:20px;
    color:var(--accent);
    line-height:1.2;
  }

  .resenas{
    display:inline-block;
    background:#faf3f3;
    color:var(--accent);
    border:1px solid rgba(139,0,0,.18);
    border-radius:999px;
    padding:6px 10px;
    font-weight:700;
    font-size:13px;
    white-space:nowrap;
  }

  .resumen p{
    margin:6px 0;
    font-size:14px;
    line-height:1.45;
  }

  .descripcion{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #f0eeee;
  }

  .descripcion p{
    margin:6px 0;
    font-size:14px;
    line-height:1.5;
  }

  .autor{
    color:var(--muted);
    font-style:italic;
  }

  .web-link{
    color:var(--accent);
    text-decoration:none;
    word-break:break-word;
  }

  .web-link:hover{
    text-decoration:underline;
  }

  .btn-detalles{
    margin-top:12px;
    background:#8b0000;
    color:white;
    border:none;
    padding:9px 14px;
    border-radius:8px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }

  .btn-detalles:hover{
    opacity:.92;
  }

  .detalles{
    display:none;
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }

  .detalles.abierto{
    display:block;
  }

  .detalle-box{
    background:#fcfbfb;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:12px;
  }

  .detalle-box h3{
    margin:0 0 8px 0;
    color:var(--accent);
    font-size:15px;
  }

  .detalle-box ul{
    margin:0;
    padding-left:18px;
  }

  .detalle-box li{
    margin:5px 0;
    font-size:14px;
    line-height:1.45;
  }

  .detalle-box p{
    margin:5px 0;
    font-size:14px;
    line-height:1.45;
  }

  .muted{
    color:var(--muted);
  }

  .mensaje{
    grid-column:1 / -1;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    border:1px solid var(--border);
    font-size:15px;
  }

  @media (max-width: 800px){
    .lista-restaurantes{
      grid-template-columns:1fr;
    }
  }
</style>
</head>

<body>

<header class="page-header">
  <h1>
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="white" viewBox="0 0 24 24">
      <path d="M11 9H9V2H7v7H5V2H3v7c0 2.21 1.79 4 4 4v9h2v-9c2.21 0 4-1.79 4-4V2h-2v7zm4-7v20h2v-8h3V2h-5z"/>
    </svg>
    Restaurantes
  </h1>
</header>

<div class="container">

  <a href="index.html" class="volver">← Volver</a>

  <div id="lista-restaurantes" class="lista-restaurantes">
    <div class="mensaje">Cargando restaurantes…</div>
  </div>

</div>

<script>
  function formatearFecha(fecha){
    if(!fecha) return "—";
    const f = new Date(fecha);
    if(isNaN(f)) return fecha;
    return f.toLocaleDateString("es-ES");
  }

  function listaAHTML(lista){
    if(!Array.isArray(lista) || lista.length === 0){
      return '<p class="muted">Sin datos</p>';
    }
    return `<ul>${lista.map(item => `<li>${item}</li>`).join("")}</ul>`;
  }

  function textoSeguro(valor){
    return (valor !== undefined && valor !== null && String(valor).trim() !== "") ? valor : "—";
  }

  function crearFicha(rest, index){
    const web = rest.web && String(rest.web).trim() !== ""
      ? `<a class="web-link" href="${rest.web}" target="_blank" rel="noopener noreferrer">${rest.web}</a>`
      : "—";

    const descripcion = rest.descripcion && String(rest.descripcion).trim() !== ""
      ? rest.descripcion
      : "Sin descripción";

    const autor = rest.autor && String(rest.autor).trim() !== ""
      ? rest.autor
      : "Sin autor";

    const resenas = rest.resenas && String(rest.resenas).trim() !== ""
      ? rest.resenas
      : "Sin valoración";

    return `
      <div class="restaurante">
        <div class="restaurante-top">
          <h2>${textoSeguro(rest.nombre)}</h2>
          <div class="resenas">${resenas}</div>
        </div>

        <div class="resumen">
          <p><b>Fecha:</b> ${formatearFecha(rest.fecha)}</p>
          <p><b>Dirección:</b> ${textoSeguro(rest.direccion)}</p>
          <p><b>Teléfono:</b> ${textoSeguro(rest.telefono)}</p>
          <p><b>Web:</b> ${web}</p>
        </div>

        <div class="descripcion">
          <p><b>Descripción:</b> ${descripcion}</p>
          <p class="autor"><b>Autor:</b> ${autor}</p>
        </div>

        <button class="btn-detalles" onclick="toggleDetalles(${index})" id="btn-${index}">
          Ver más
        </button>

        <div class="detalles" id="detalles-${index}">
          <div class="detalle-box">
            <h3>Organizadores</h3>
            ${listaAHTML(rest.organizadores)}
          </div>

          <div class="detalle-box">
            <h3>Entrantes</h3>
            ${listaAHTML(rest.entrantes)}
          </div>

          <div class="detalle-box">
            <h3>Platos principales</h3>
            ${listaAHTML(rest.platos_principales)}
          </div>

          <div class="detalle-box">
            <h3>Postres</h3>
            ${listaAHTML(rest.postres)}
          </div>

          <div class="detalle-box">
            <h3>Bebidas</h3>
            ${listaAHTML(rest.bebidas)}
          </div>

          <div class="detalle-box">
            <h3>Precio</h3>
            <p><b>${textoSeguro(rest.precio)}</b></p>
          </div>

          <div class="detalle-box">
            <h3>Asistieron</h3>
            ${listaAHTML(rest.asistieron)}
          </div>

          <div class="detalle-box">
            <h3>No asistieron</h3>
            ${listaAHTML(rest.no_asistieron)}
          </div>
        </div>
      </div>
    `;
  }

  function toggleDetalles(index){
    const detalles = document.getElementById(`detalles-${index}`);
    const boton = document.getElementById(`btn-${index}`);

    if(detalles.classList.contains("abierto")){
      detalles.classList.remove("abierto");
      boton.textContent = "Ver más";
    } else {
      detalles.classList.add("abierto");
      boton.textContent = "Ver menos";
    }
  }

  fetch("restaurantes.json?v=" + Date.now(), { cache: "no-store" })
    .then(res => {
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(data => {
      const lista = document.getElementById("lista-restaurantes");
      const restaurantes = Array.isArray(data.restaurantes) ? data.restaurantes : [];

      if(restaurantes.length === 0){
        lista.innerHTML = `<div class="mensaje">No hay restaurantes disponibles.</div>`;
        return;
      }

      lista.innerHTML = restaurantes
        .sort((a, b) => new Date(b.fecha) - new Date(a.fecha))
        .map((rest, index) => crearFicha(rest, index))
        .join("");
    })
    .catch(error => {
      document.getElementById("lista-restaurantes").innerHTML =
        `<div class="mensaje">❌ Error cargando restaurantes: ${error.message}</div>`;
    });
</script>

</body>
</html>
