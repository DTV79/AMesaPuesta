<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f8f5f0">
<title>Restaurantes</title>
<link rel="stylesheet" href="styles.css">

<style>
:root{
  --bg:#f8f5f0;
  --card:#ffffff;
  --ink:#1f1f1f;
  --muted:#6b7280;
  --accent:#8b0000;
  --border:#e5e7eb;
}

body{
  margin:0;
  background:var(--bg);
  font-family:system-ui;
  color:var(--ink);
}

.container{
  width:min(1100px,92vw);
  margin:20px auto 60px;
}

.volver{
  display:inline-block;
  background:#8b0000;
  color:white;
  padding:8px 16px;
  border-radius:6px;
  text-decoration:none;
  font-weight:600;
  margin-bottom:24px;
}

/* FILTROS */
.filtros{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.fechas-wrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.fecha-input,.buscador{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
}

/* TARJETAS */
.lista-restaurantes{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.restaurante{
  background:white;
  padding:18px;
  border-radius:12px;
  border:1px solid var(--border);
}

.resenas{
  color:#d4a017;
  font-size:18px;
}

/* CITA */
.cita-cofrade{
  margin-top:12px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.cita-texto{
  color:#8b0000;
  font-style:italic;
  font-weight:600;
}

/* DETALLES */
.detalles{ display:none; }
.detalles.abierto{ display:block; }

.detalle-box{
  margin-top:10px;
}

/* BOTÓN SUBIR */
#btnSubir{
  position:fixed;
  right:20px;
  bottom:20px;
  width:50px;
  height:50px;
  border:none;
  border-radius:50%;
  background:#8b0000;
  color:white;
  cursor:pointer;
  display:none;
}
#btnSubir.show{ display:block; }

@media(max-width:800px){
  .lista-restaurantes{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="page-header">
<h1>🍴 Restaurantes</h1>
</header>

<div class="container">

<a href="index.html" class="volver">← Volver</a>

<div class="filtros">
<input id="buscador" class="buscador" placeholder="Buscar...">

<div class="fechas-wrap">
<input id="fecha-desde" class="fecha-input" placeholder="dd/mm/aaaa">
<input id="fecha-hasta" class="fecha-input" placeholder="dd/mm/aaaa">
</div>

<button id="limpiar">Limpiar</button>
</div>

<div id="contador"></div>
<div id="lista-restaurantes"></div>

</div>

<button id="btnSubir">↑</button>

<script>
let TODOS = [];

/* FORMATO FECHA */
function formatearFecha(f){
  if(!f) return "";
  const d = new Date(f);
  return d.toLocaleDateString("es-ES");
}

/* ORDENAR LISTAS */
function listaAHTML(lista, ordenar=false){
  if(!Array.isArray(lista)) return "";
  const arr = [...lista];
  if(ordenar){
    arr.sort((a,b)=>a.localeCompare(b,"es"));
  }
  return "<ul>"+arr.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
}

/* FICHA */
function crearFicha(r,i){
return `
<div class="restaurante">
  <h2>${r.nombre}</h2>
  <div class="resenas">${r.resenas}</div>

  <p><b>Fecha:</b> ${formatearFecha(r.fecha)}</p>

  <div class="cita-cofrade">
    <p class="cita-texto">✒ "${r.descripcion || ""}"</p>
    <p>— ${r.autor || ""}</p>
  </div>

  <button onclick="toggle(${i})" id="btn-${i}">Ver más</button>

  <div class="detalles" id="det-${i}">
    <div class="detalle-box">
      <h3>Organizadores</h3>
      ${listaAHTML(r.organizadores,true)}
    </div>

    <div class="detalle-box">
      <h3>Asistieron (${r.asistieron?.length || 0})</h3>
      ${listaAHTML(r.asistieron,true)}
    </div>

    <div class="detalle-box">
      <h3>No asistieron (${r.no_asistieron?.length || 0})</h3>
      ${listaAHTML(r.no_asistieron,true)}
    </div>
  </div>
</div>`;
}

/* TOGGLE */
function toggle(i){
  const d = document.getElementById("det-"+i);
  const b = document.getElementById("btn-"+i);
  d.classList.toggle("abierto");
  b.textContent = d.classList.contains("abierto")?"Ver menos":"Ver más";
}

/* RENDER */
function pintar(lista){
  const c = document.getElementById("lista-restaurantes");
  c.innerHTML = lista.map((r,i)=>crearFicha(r,i)).join("");
}

/* FETCH */
fetch("restaurantes.json")
.then(r=>r.json())
.then(data=>{
  TODOS = data.restaurantes || [];
  pintar(TODOS);
});

/* SUBIR */
const btn = document.getElementById("btnSubir");
window.addEventListener("scroll",()=>{
  btn.classList.toggle("show",window.scrollY>200);
});
btn.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
</script>

</body>
</html>
