<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso cofrades · A Mesa Puesta</title><style>:root{font-family:system-ui,sans-serif;background:#f7f3ed;color:#2d2926}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:90px auto 40px;padding:18px}.card{background:white;border:1px solid #e7ded3;border-radius:18px;padding:24px;box-shadow:0 8px 24px #0001}h1{margin-top:0}label{display:block;font-weight:700;margin:16px 0 6px}select,input,button{font:inherit;width:100%;padding:12px;border-radius:10px}select,input{border:1px solid #d8cec3}button{border:0;background:#8b1e2d;color:white;font-weight:800;cursor:pointer;margin-top:18px}button:disabled{opacity:.6}a{color:#8b1e2d}.muted{color:#746d66}#mensaje{min-height:22px;margin-top:14px}</style></head><body><main class="wrap"><section class="card"><h1 style="display:flex;align-items:center;gap:12px"><img src="https://dtv79.github.io/AMesaPuesta/Fotos/logo-cangrejo.png" alt="Logotipo del cangrejo" width="42" height="42" style="width:42px;height:42px;object-fit:contain;flex-shrink:0"> Acceso de cofrades</h1><p class="muted">Identifícate con tu nombre y la clave que te ha facilitado la administración.</p><form id="form"><label for="cofrade">Cofrade</label><select id="cofrade" required><option value="">Cargando cofrades…</option></select><label for="clave">Clave personal</label><input id="clave" type="password" required autocomplete="current-password"><button id="entrar">Entrar</button></form><p id="mensaje" role="status"></p></section></main><script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/+esm";
const sb=createClient("https://wmfcpnihymiiwgpvbngj.supabase.co","sb_publishable_ij3sYbyMrLI2B34OOYt6JA_Aez1R2cJ");
const endpoint="https://wmfcpnihymiiwgpvbngj.supabase.co/functions/v1/acceso-cofrade";
const form=document.querySelector("#form"),cofrade=document.querySelector("#cofrade"),clave=document.querySelector("#clave"),mensaje=document.querySelector("#mensaje"),entrar=document.querySelector("#entrar");
const{data,error}=await sb.rpc("listar_accesos_cofrades");cofrade.replaceChildren(new Option(error?"No se pudieron cargar los cofrades":"Selecciona tu nombre",""));if(!error)(data||[]).forEach(c=>cofrade.add(new Option(c.nombre,c.id)));
form.addEventListener("submit",async e=>{e.preventDefault();entrar.disabled=true;mensaje.textContent="Comprobando acceso…";try{const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",cofrade_id:cofrade.value,clave:clave.value})});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||"No se pudo iniciar sesión");sessionStorage.removeItem("amp_cofrade_token");localStorage.setItem("amp_cofrade_token",d.token);const volver=new URLSearchParams(location.search).get("volver");const ruta=volver&&volver.startsWith("/v2/")&&!volver.startsWith("//")?volver:"v2/index.html";location.replace(ruta);}catch(err){mensaje.textContent=err.message;clave.value=""}finally{entrar.disabled=false}});
</script></body></html>
