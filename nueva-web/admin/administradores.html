<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Administradores · A Mesa Puesta</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#2d2926;background:#f7f3ed}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{text-decoration:none;color:#8b1e2d;font-weight:800}.top h1{margin:0;font-size:25px}.card{background:#fff;border:1px solid #e7ded3;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #00000008}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#746d66;font-size:14px}.pill{padding:5px 9px;border-radius:999px;background:#f0ebe4;font-size:12px;font-weight:800}.ok{background:#e8f5eb;color:#236b36}.pending{background:#fff4d8;color:#7d5b00}input{width:100%;padding:12px;border:1px solid #d8cec3;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#8b1e2d;color:white}.soft{background:#f0ebe4;color:#443d37}.danger{background:#fff0f0;color:#9b1c1c}.form{display:grid;grid-template-columns:1fr auto;gap:8px}.sectionTitle{margin:24px 0 8px}.empty{padding:18px;text-align:center;color:#746d66}.msg{margin-top:8px;font-size:14px}@media(max-width:600px){.wrap{padding:14px}.form{grid-template-columns:1fr}.card .row{align-items:stretch;flex-direction:column}.adminActions button{margin-top:6px;width:100%}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html">← Volver</a><h1>🛡️ Administradores</h1></div><div class="card"><h2 style="margin-top:0">Añadir administrador</h2><p class="muted">Introduce su correo. La persona utilizará ese correo para acceder y establecer su propia contraseña.</p><div class="form"><input id="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com"><button id="invitar" class="btn primary">+ Autorizar</button></div><div id="msg" class="msg"></div></div><h2 class="sectionTitle">Administradores actuales</h2><div id="admins"><div class="card empty">Cargando…</div></div><h2 class="sectionTitle">Invitaciones</h2><div id="invites"><div class="card empty">Cargando…</div></div></main><script>
const sb=supabase.createClient("https://wmfcpnihymiiwgpvbngj.supabase.co","sb_publishable_ij3sYbyMrLI2B34OOYt6JA_Aez1R2cJ"),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fecha=x=>x?new Date(x).toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"}):"—";
async function guard(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href="index.html";return false}const{data,error}=await sb.rpc("soy_admin_cofradia");if(error||!data){document.body.innerHTML='<main class="wrap"><div class="card">Acceso no autorizado.</div></main>';return false}return true}
async function cargar(){const{data,error}=await sb.rpc("listar_administradores_cofradia");if(error){$("admins").innerHTML='<div class="card">'+esc(error.message)+'</div>';return}const admins=data?.administradores||[],inv=data?.invitaciones||[];$("admins").innerHTML=admins.length?admins.map(a=>'<div class="card"><div class="row"><div><b>'+esc(a.email)+'</b><div class="muted">Desde '+fecha(a.creado_en)+(a.es_actual?' · Tú':'')+'</div></div><div class="adminActions"><span class="pill '+(a.activo?'ok':'')+'">'+(a.activo?'Activo':'Revocado')+'</span> '+(a.activo&&!a.es_actual?'<button class="btn danger revoke" data-id="'+a.usuario_id+'">Quitar permisos</button>':'')+'</div></div></div>').join(""):'<div class="card empty">No hay administradores.</div>';$("invites").innerHTML=inv.length?inv.map(i=>'<div class="card"><div class="row"><div><b>'+esc(i.email)+'</b><div class="muted">Creada '+fecha(i.creado_en)+'</div></div><div class="adminActions"><span class="pill '+(i.estado==="aceptada"?"ok":i.estado==="pendiente"?"pending":"")+'">'+esc(i.estado)+'</span> '+(i.estado==="pendiente"?'<button class="btn soft renew" data-id="'+i.id+'">Renovar</button> <button class="btn danger cancel" data-id="'+i.id+'">Cancelar</button>':'')+'</div></div></div>').join(""):'<div class="card empty">No hay invitaciones.</div>';wire()}
function wire(){document.querySelectorAll(".revoke").forEach(b=>b.onclick=()=>accion("revocar_administrador_cofradia",{p_usuario_id:b.dataset.id},"¿Quitar permisos de administrador?"));document.querySelectorAll(".renew").forEach(b=>b.onclick=()=>accion("renovar_invitacion_admin_cofradia",{p_id:b.dataset.id}));document.querySelectorAll(".cancel").forEach(b=>b.onclick=()=>accion("cancelar_invitacion_admin_cofradia",{p_id:b.dataset.id},"¿Cancelar esta invitación?"))}async function accion(fn,args,q){if(q&&!confirm(q))return;const{error}=await sb.rpc(fn,args);if(error)return alert(error.message);await cargar()}
$("invitar").onclick=async()=>{const email=$("email").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email)){$("msg").textContent="Introduce un correo válido.";return}$("invitar").disabled=true;const{data,error}=await sb.rpc("autorizar_administrador_cofradia",{p_email:email});$("invitar").disabled=false;if(error){$("msg").textContent=error.message;return}$("email").value="";$("msg").textContent=data?.mensaje||"Administrador autorizado correctamente.";await cargar()};(async()=>{if(await guard())await cargar()})();</script></body></html>
