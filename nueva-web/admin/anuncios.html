<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anuncios · Administración</title><style>:root{font-family:Inter,system-ui;background:#f6f4ef;color:#26231f}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:20px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:21px;font-weight:900}.muted{color:#77736b}.title{font-size:32px;margin:28px 0 5px}.btn,.soft{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.btn{background:#222;color:white}.soft{background:#eee9e1}.list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:18px;padding:18px}.pill{font-size:12px;font-weight:800;padding:5px 8px;border-radius:99px;background:#eee}.featured{background:#fff0f2;color:#a13f50}.hidden{opacity:.6}.drawer{position:fixed;inset:0;background:#0007;display:none;justify-content:flex-end;z-index:10}.drawer.open{display:flex}.sheet{width:min(590px,100%);height:100%;overflow:auto;background:white;padding:22px}.close{float:right;border:0;padding:9px 12px;border-radius:9px}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ddd5ca;border-radius:10px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.danger{background:#fae8e6;color:#a33}.actions{display:flex;gap:7px;margin-top:14px}.preview{font-size:28px}@media(max-width:700px){.shell{padding:15px}.list,.grid{grid-template-columns:1fr}.title{font-size:27px}} .emoji-field{display:flex;gap:8px;align-items:flex-start}.emoji-field input,.emoji-field textarea{flex:1;min-width:0}.emoji-btn{flex:none;padding:9px}.emoji-picker{display:flex;flex-wrap:wrap;gap:4px;padding:9px;border:1px solid #e7e1d8;border-radius:10px;margin-top:8px}.emoji-picker[hidden]{display:none}.emoji-picker button{border:0;background:#f6f4ef;border-radius:7px;padding:6px;font-size:19px;cursor:pointer}.section-title{font-size:21px;margin:28px 0 0}.section-note{font-size:13px;color:#77736b;margin-top:5px}.empty-section{padding:16px;background:#fff;border:1px solid #e7e1d8;border-radius:12px;margin-top:12px;color:#77736b}.selector-emoji-completo{display:none;margin-top:8px;max-width:100%;overflow:hidden}.selector-emoji-completo.open{display:block}.selector-emoji-completo emoji-picker{width:min(360px,100%);height:340px;--border-radius:10px}</style></head><body><main class="shell"><div class="top"><div><div class="brand">🍽️ A Mesa Puesta</div><div class="muted">Administración · Anuncios</div></div></div><div class="row"><div><h1 class="title">Tablón de anuncios</h1><div class="muted">Publica, programa y destaca avisos de la Cofradía.</div></div><button id="nuevo" class="btn">+ Nuevo anuncio</button></div><div id="secciones"></div></main><div id="drawer" class="drawer"><aside class="sheet"><button id="cerrar" class="close">✕</button><div class="muted">Editor</div><h2 id="editorTitulo">Nuevo anuncio</h2><form id="form"><input type="hidden" id="aid"><div class="field"><label>Categoría</label><div class="row"><select id="tipo"><option>General</option><option>Comida</option><option>Reunión</option><option>Tesorería</option><option>Urgente</option><option>Recordatorio</option></select><span id="icono" class="preview">📣</span></div></div><div class="field"><label>Título</label><div class="emoji-field"><input id="titulo" required maxlength="180"><button type="button" class="soft emoji-btn" data-target="titulo" aria-label="Añadir emoticono al título">😊</button></div></div><div class="field"><label>Texto</label><div class="emoji-field"><textarea id="texto" rows="8"></textarea><button type="button" class="soft emoji-btn" data-target="texto" aria-label="Añadir emoticono al texto">😊</button></div></div><div id="emojiPicker" class="emoji-picker" hidden></div><div class="grid"><div class="field"><label>Fecha</label><input id="fecha" type="date"></div><div class="field"><label>Publicar desde</label><input id="publicacion" type="date"></div><div class="field"><label>Fecha fin</label><input id="fin" type="date"></div><div class="field"><label>Fecha evento</label><input id="evento" type="date"></div><div class="field"><label>Autor</label><input id="autor"></div><div class="field"><label>Orden</label><input id="orden" type="number" value="0"></div></div><div class="field"><label>Enlace opcional</label><input id="enlace" type="url"></div><div class="field"><label><input id="visible" type="checkbox" checked style="width:auto"> Visible/publicado</label><label><input id="destacado" type="checkbox" style="width:auto"> Destacar anuncio</label></div><div id="bloqueDias" class="field" style="display:none"><label>Días que permanecerá destacado</label><input id="dias" type="number" min="1" max="3650" value="15"><div id="hasta" class="muted"></div></div><button class="btn">Guardar anuncio</button> <button type="button" id="eliminar" class="soft danger">Eliminar</button></form></aside></div><script type="module" src="../js/admin/anuncios.js"></script><script src="../cabecera-comun.js"></script></body></html>
