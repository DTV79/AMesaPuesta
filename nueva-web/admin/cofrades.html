}</style></head><body><main class="shell"><div class="top"><div><div class="brand">🍽️ A Mesa Puesta</div><div class="muted">Administración</div></div><div><button id="nuevo" class="btn">+ Nuevo cofrade</button> <a href="cuotas.html" class="linkbtn">Cuotas</a></div></div><h1 class="title">Cofrades</h1><div class="muted">Gestión de miembros, accesos y situación de cuotas.</div><div class="toolbar"><input id="buscar" placeholder="Buscar cofrade…"><select id="estado"><option value="todos">Todos</option><option value="activos">Activos</option><option value="bajas">Bajas</option></select></div><section id="lista" class="list"></section></main>
