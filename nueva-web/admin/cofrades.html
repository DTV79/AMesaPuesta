<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cofrades · Administración</title><style>
:root{font-family:Inter,system-ui,sans-serif;background:#f6f4ef;color:#26231f}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:22px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:850}.muted{color:#77736b}.title{font-size:32px;margin:28px 0 5px}.panel,.card{background:#fff;border:1px solid #e8e3da;border-radius:18px;padding:18px;box-shadow:0 3px 14px #00000008}.toolbar{display:flex;gap:9px;margin:20px 0;flex-wrap:wrap}.toolbar input,.toolbar select,.field input,.field select{padding:11px;border:1px solid #dcd6cc;border-radius:10px;font:inherit}.toolbar input{flex:1;min-width:190px}.list{display:grid;gap:9px}.member{cursor:pointer}.avatar{width:42px;height:42px;border-radius:50%;background:#eee9e1;display:grid;place-items:center;font-weight:850}.memberMain{display:flex;align-items:center;gap:12px}.name{font-weight:800}.pill{font-size:12px;font-weight:800;border-radius:99px;padding:6px 9px}.ok{color:#26754e;background:#e9f5ed}.bad{color:#ad4842;background:#faecea}.founder{color:#765e17;background:#fbf1cc}.drawer{position:fixed;inset:0;background:#0007;display:none;justify-content:flex-end;z-index:20}.drawer.open{display:flex}.sheet{width:min(520px,100%);height:100%;overflow:auto;background:white;padding:22px}.close{float:right;border:0;border-radius:10px;padding:9px 12px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%}.btn{border:0;background:#222;color:#fff;padding:12px 15px;border-radius:11px;font-weight:800}.linkbtn{border:0;background:#f1eee8;padding:11px;border-radius:10px;font-weight:750}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.stat{padding:14px;background:#f7f4ef;border-radius:12px}.stat strong{display:block;font-size:20px;margin-top:4px}@media(max-width:650px){.shell{padding:15px}.title{font-size:27px}.member{padding:14px}.hideMob{display:none}}</style></head><body><main class="shell"><div class="top"><div><div class="brand">🍽️ A Mesa Puesta</div><div class="muted">Administración</div></div><div><button id="nuevo" class="btn">+ Nuevo cofrade</button> <a href="cuotas.html" class="linkbtn">Cuotas</a></div></div><h1 class="title">Cofrades</h1><div class="muted">Gestión de miembros, accesos y situación de cuotas.</div><div class="toolbar"><input id="buscar" placeholder="Buscar cofrade…"><select id="estado"><option value="todos">Todos</option><option value="activos">Activos</option><option value="bajas">Bajas</option></select></div><section id="lista" class="list"></section></main>
<div id="nuevoDrawer" class="drawer"><aside class="sheet"><button id="cerrarNuevo" class="close">✕</button><div class="muted">Administración</div><h2>Nuevo cofrade</h2><form id="nuevoForm"><div class="field"><label>Nombre</label><input id="nNombre" required></div><div class="field"><label>Fecha de ingreso</label><input id="nIngreso" type="date" required></div><div class="field"><label>Categoría</label><select id="nCategoria"><option>Cofrade</option><option>Aprendiz</option><option>Cofrade Fundador</option></select></div><div class="field"><label><input id="nFundador" type="checkbox" style="width:auto"> Cofrade fundador</label></div><button class="btn">Dar de alta</button></form><p class="muted">Después del alta podrás vincular su cuenta privada desde la ficha.</p></aside></div><div id="drawer" class="drawer"><aside class="sheet"><button id="cerrar" class="close">✕</button><div class="muted">Ficha del cofrade</div><h2 id="titulo"></h2><div id="resumen" class="stats"></div><form id="form"><input type="hidden" id="id"><div class="field"><label>Nombre</label><input id="nombre" required></div><div class="field"><label>Fecha de ingreso</label><input id="ingreso" type="date" required></div><div class="field"><label>Categoría</label><select id="categoria"><option>Cofrade Fundador</option><option>Cofrade</option><option>Aprendiz</option><option>Baja Cofradía</option></select></div><div class="field"><label>Fecha de baja</label><input id="baja" type="date"></div><div class="field"><label><input id="fundador" type="checkbox" style="width:auto"> Cofrade fundador</label></div><button class="btn">Guardar cambios</button> <button type="button" id="estadoMiembro" class="linkbtn"></button></form><hr style="border:0;border-top:1px solid #eee;margin:24px 0"><h3>Cuenta privada</h3><div id="cuenta" class="muted"></div><div class="field"><label>Correo para vincular cuenta</label><input id="correo" type="email" placeholder="correo@ejemplo.com"></div><button id="vincular" class="linkbtn">Vincular cuenta</button> <button id="desvincular" class="linkbtn">Desvincular</button></aside></div>
<script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/+esm";const sb=createClient("https://wmfcpnihymiiwgpvbngj.supabase.co","sb_publishable_ij3sYbyMrLI2B34OOYt6JA_Aez1R2cJ");let miembros=[],cuentas=[],estados=[];const euro=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(n||0));async function cargar(){const{data:{session}}=await sb.auth.getSession();if(!session)return document.body.innerHTML="<main class=shell><section class=panel><h1>Administración</h1><p>Debes iniciar sesión.</p></section></main>";const{data:admin}=await sb.rpc("soy_admin_cofradia");if(!admin)return document.body.innerHTML="<main class=shell><h1>Acceso restringido</h1></main>";({data:miembros}=await sb.rpc("listar_cofrades_admin"));({data:cuentas}=await sb.rpc("listar_cuentas_cofrades_admin"));const e=await sb.rpc("resumen_cuotas_cofrades_admin",{p_ejercicio:2026});estados=e.data||[];render()}function render(){const q=buscar.value.toLowerCase(),f=estado.value;lista.innerHTML=miembros.filter(m=>m.nombre.toLowerCase().includes(q)&&(f==="todos"||(f==="activos"&&!m.fecha_baja)||(f==="bajas"&&m.fecha_baja))).map(m=>{const e=estados.find(x=>x.cofrade_id===m.id);return '<div class="card member row" data-id="'+m.id+'"><div class=memberMain><div class=avatar>'+m.nombre[0]+'</div><div><div class=name>'+m.nombre+'</div><div class=muted>'+m.categoria+'</div></div></div><div><span class="pill '+(m.fecha_baja?"bad":"ok")+'">'+(m.fecha_baja?"Baja":"Activo")+'</span> '+(e?'<span class="pill '+(e.estado==="al_corriente"?"ok":"bad")+' hideMob">'+(e.estado==="al_corriente"?"Cuotas al día":"Pendiente "+euro(e.pendiente))+"</span>":"")+"</div></div>"}).join("");document.querySelectorAll(".member").forEach(x=>x.onclick=()=>abrir(x.dataset.id))}nuevo.onclick=()=>{nIngreso.value=new Date().toISOString().slice(0,10);nNombre.value="";nCategoria.value="Cofrade";nFundador.checked=false;nuevoDrawer.classList.add("open")};cerrarNuevo.onclick=()=>nuevoDrawer.classList.remove("open");nuevoForm.onsubmit=async e=>{e.preventDefault();const fundadorNuevo=nFundador.checked||nCategoria.value==="Cofrade Fundador";const{data:newId,error}=await sb.rpc("crear_cofrade_admin",{p_nombre:nNombre.value,p_fecha_ingreso:nIngreso.value,p_categoria:nCategoria.value,p_fundador:fundadorNuevo});if(error)return alert(error.message);nuevoDrawer.classList.remove("open");await cargar();abrir(newId)};
function abrir(id){const m=miembros.find(x=>x.id===id),e=estados.find(x=>x.cofrade_id===id),c=cuentas?.find(x=>x.cofrade_id===id);titulo.textContent=m.nombre;document.querySelector("#id").value=id;nombre.value=m.nombre;ingreso.value=m.fecha_ingreso||"";baja.value=m.fecha_baja||"";categoria.value=m.categoria||"Cofrade";fundador.checked=m.fundador;resumen.innerHTML='<div class=stat><span class=muted>Estado</span><strong>'+(m.fecha_baja?"Baja":"Activo")+'</strong></div><div class=stat><span class=muted>Cuotas 2026</span><strong>'+(e?(e.estado==="al_corriente"?"Al día":euro(e.pendiente)+" pendiente"):"—")+"</strong></div>";cuenta.textContent=m.usuario_auth_id?(c?.correo||"Cuenta vinculada"):"Sin cuenta vinculada";desvincular.style.display=m.usuario_auth_id?"inline-block":"none";estadoMiembro.textContent=m.fecha_baja?"Reactivar cofrade":"Dar de baja";estadoMiembro.dataset.baja=m.fecha_baja?"1":"0";drawer.classList.add("open")}buscar.oninput=render;estado.onchange=render;cerrar.onclick=()=>drawer.classList.remove("open");form.onsubmit=async e=>{e.preventDefault();const{error}=await sb.rpc("actualizar_cofrade_admin",{p_cofrade_id:id.value,p_nombre:nombre.value,p_fecha_ingreso:ingreso.value,p_fecha_baja:baja.value||null,p_categoria:categoria.value,p_fundador:fundador.checked});if(error)return alert(error.message);drawer.classList.remove("open");await cargar()};vincular.onclick=async()=>{if(!correo.value)return;const{error}=await sb.rpc("vincular_cuenta_cofrade_admin",{p_cofrade_id:id.value,p_correo:correo.value.trim()});if(error)return alert(error.message);await cargar();abrir(id.value)};estadoMiembro.onclick=async()=>{const estaBaja=estadoMiembro.dataset.baja==="1";let fecha=null;if(!estaBaja){fecha=prompt("Fecha de baja (AAAA-MM-DD)",new Date().toISOString().slice(0,10));if(!fecha)return;if(!confirm("Se marcará como baja, pero se conservará todo su historial. ¿Continuar?"))return}else if(!confirm("¿Reactivar a este cofrade?"))return;const{error}=await sb.rpc("cambiar_estado_cofrade_admin",{p_cofrade_id:id.value,p_fecha_baja:fecha});if(error)return alert(error.message);drawer.classList.remove("open");await cargar()};
desvincular.onclick=async()=>{if(!confirm("¿Desvincular la cuenta privada de este cofrade?"))return;const{error}=await sb.rpc("desvincular_cuenta_cofrade_admin",{p_cofrade_id:id.value});if(error)return alert(error.message);await cargar();abrir(id.value)};cargar();</script></body></html>
