<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encuestas · Administración</title><style>
:root{font-family:Inter,system-ui,sans-serif;background:#f6f4ef;color:#26231f}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:20px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;font-size:21px}.muted{color:#77736b}.title{font-size:32px;margin:28px 0 5px}.btn,.soft{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.btn{background:#222;color:#fff}.soft{background:#eee9e1;color:#333}.list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.grupo-encuestas{margin-top:28px}.grupo-encuestas h2{font-size:22px;margin:0 0 4px}.grupo-encuestas .subgrupo{color:#77736b;font-size:13px;margin:0}.grupo-encuestas .list{margin-top:12px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:18px;padding:18px}.pill{font-size:12px;font-weight:800;padding:5px 8px;border-radius:99px;background:#eef5ef;color:#27704d}.closed{background:#eee;color:#666}.actions{display:flex;gap:8px;margin-top:15px}.drawer{position:fixed;inset:0;background:#0007;display:none;justify-content:flex-end;z-index:10}.drawer.open{display:flex}.sheet{width:min(590px,100%);height:100%;overflow:auto;background:white;padding:22px}.close{float:right;border:0;padding:9px 12px;border-radius:9px}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ddd5ca;border-radius:10px;font:inherit}.option{display:flex;gap:7px;margin:8px 0}.option input{flex:1}.emoji{border:0;border-radius:9px;background:#f2eee7;font-size:19px;padding:7px 10px}.emojiBox{display:none;flex-wrap:wrap;gap:5px;padding:9px;background:#f7f4ef;border-radius:10px;margin-top:6px}.emojiBox.open{display:flex}.emojiBox button{border:0;background:white;border-radius:8px;padding:7px;font-size:19px}.danger{background:#fae8e6;color:#a33}.results{margin-top:12px;padding-top:12px;border-top:1px solid #eee}.bar{height:7px;background:#eee;border-radius:99px;overflow:hidden;margin:4px 0 9px}.fill{height:100%;background:#555}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks label{font-weight:600}@media(max-width:700px){.shell{padding:15px}.list{grid-template-columns:1fr}.title{font-size:27px}.checks{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="top"><div><div class="brand">🍽️ A Mesa Puesta</div><div class="muted">Administración · Encuestas</div></div></div><div class="row"><div><h1 class="title">Encuestas</h1><div class="muted">Crea votaciones y consulta su participación.</div></div><button id="nueva" class="btn">+ Nueva encuesta</button></div><div id="lista"></div></main>
<div id="drawer" class="drawer"><aside class="sheet"><button id="cerrar" class="close">✕</button><div class="muted">Editor de encuesta</div><h2 id="editorTitulo">Nueva encuesta</h2><form id="form"><input type="hidden" id="eid"><div class="field"><label>Pregunta / título</label><div class="option"><input id="titulo" maxlength="180" required><button type="button" class="emoji" data-target="titulo">😊</button></div><div class="emojiBox"></div></div><div class="field"><label>Descripción</label><textarea id="descripcion" rows="3" maxlength="2000"></textarea></div><div class="field"><label>Opciones</label><div id="opciones"></div><button type="button" id="addOpcion" class="soft">+ Añadir opción</button></div><div class="checks"><div class="field"><label>Tipo</label><select id="tipo"><option value="publica">Pública</option><option value="secreta">Secreta</option><option value="participacion">Participación</option></select></div><div class="field"><label>Estado</label><select id="estado"><option value="borrador">Borrador</option><option value="abierta">Abierta</option><option value="programada">Programada</option><option value="pausada">Pausada</option><option value="cerrada">Cerrada</option><option value="archivada">Archivada</option></select></div><div class="field"><label>Máximo de opciones</label><input id="max" type="number" min="1" max="20" value="1"></div><div class="field"><label>Electores</label><select id="electores"><option value="todos">Todos</option><option value="cofrades">Solo cofrades</option></select></div><div class="field"><label>Apertura (opcional)</label><input id="abre" type="datetime-local"></div><div class="field"><label>Cierre (opcional)</label><input id="cierra" type="datetime-local"></div></div><div class="field"><label><input id="mostrarResultados" type="checkbox" checked style="width:auto"> Mostrar resultados</label><label><input id="mostrarGanador" type="checkbox" checked style="width:auto"> Mostrar ganador</label></div><button class="btn">Guardar encuesta</button> <button type="button" id="eliminar" class="soft danger">Eliminar</button></form></aside></div>
<script type="module" src="../js/admin/encuestas.js"></script><script src="../cabecera-comun.js"></script></body></html>
