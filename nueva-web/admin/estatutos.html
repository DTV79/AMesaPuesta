<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estatutos · Administración</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#f6f4ef;color:#26231f}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:18px}.top,.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.back{color:#8b1e2d;text-decoration:none;font-weight:800}.title{font-size:32px;margin:24px 0 4px}.muted{color:#777169}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#8b1e2d;color:#fff}.soft{background:#eee8df}.danger{background:#f8e7e7;color:#8b1e2d}.grid{display:grid;grid-template-columns:330px 1fr;gap:14px;margin-top:18px}.panel,.card{background:#fff;border:1px solid #e7e0d7;border-radius:18px;padding:16px}.version{cursor:pointer;margin:8px 0}.version.active{outline:2px solid #8b1e2d}.pill{font-size:12px;padding:5px 8px;border-radius:99px;background:#f2eee8}.ok{background:#e7f3eb;color:#287049}.draft{background:#fff0cf;color:#86621b}.hist{background:#eee;color:#666}.editor{display:none}.editor.open{display:block}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:13px;font-weight:750;margin:9px 0 5px}input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid #d9d1c7;border-radius:10px;background:#fff}textarea{min-height:82px}.bloque{margin:10px 0}.bloque textarea{min-height:120px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.review{background:#faf7f1;border-radius:12px;padding:12px;margin-top:10px}.locked{opacity:.7}.msg{font-weight:750;margin-top:10px}@media(max-width:780px){.shell{padding:13px}.grid,.twocol{grid-template-columns:1fr}.title{font-size:27px}.top{align-items:flex-start}}</style></head><body><main class="shell"><div class="top"><div><a class="back" href="index.html">← Administración</a><h1 class="title">Estatutos</h1><div class="muted">Versiones oficiales, contenido web e histórico.</div></div><button id="nueva" class="btn primary">+ Nueva versión</button></div><div class="grid"><aside class="panel"><strong>Versiones</strong><div id="versiones"></div></aside><section id="editor" class="panel editor"><div class="row"><div><h2 id="tituloVersion">Versión</h2><span id="estadoVersion" class="pill"></span></div><button id="cerrar" class="btn soft">Cerrar</button></div><div class="twocol"><div><label>Versión</label><input id="version" disabled></div><div><label>Fecha aprobación</label><input id="fechaAprobacion" type="date"></div></div><div class="twocol"><div><label>Fecha entrada en vigor</label><input id="fechaVigencia" type="date"></div><div><label>Tipo de asamblea</label><input id="tipoAsamblea" placeholder="Ordinaria, extraordinaria…"></div></div><label>Descripción de los cambios</label><textarea id="descripcionCambios"></textarea><div class="twocol"><div><label>Referencia del acta</label><input id="actaReferencia"></div><div><label>PDF oficial (ruta)</label><input id="pdfRuta" placeholder="estatutos/Estatutos_v2.pdf"></div></div><div class="twocol"><div><label>Votos a favor</label><input id="vFavor" type="number" min="0"></div><div><label>Votos en contra</label><input id="vContra" type="number" min="0"></div></div><label>Abstenciones</label><input id="vAbst" type="number" min="0"><h3>🌐 Versión web</h3><div class="muted">Capítulos, artículos y disposiciones que se mostrarán en la web.</div><div id="bloques"></div><div class="actions"><button id="addCap" class="btn soft">+ Capítulo</button><button id="addArt" class="btn soft">+ Artículo</button><button id="guardar" class="btn primary">Guardar borrador</button><button id="revisar" class="btn soft">🔍 Revisar cambios</button><button id="aprobar" class="btn danger">🔒 Aprobar y publicar</button></div><div id="revision"></div><div id="msg" class="msg"></div></section></div></main><script type="module" src="../js/admin/estatutos.js"></script></body></html>
