<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Alta de administrador · A Mesa Puesta</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#f6f4ef;color:#25231f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);background:#fff;border:1px solid #e8e3da;border-radius:22px;padding:26px;box-shadow:0 10px 35px #0001}h1{margin:5px 0 8px;font-size:28px}.muted{color:#77736b}.field{margin:18px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #dcd6cc;border-radius:11px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:13px;background:#222;color:#fff;font-weight:800;font-size:15px}.msg{margin-top:15px;padding:12px;border-radius:11px;background:#f5f1ea;display:none}.ok{background:#e8f5ed;color:#21633f}.bad{background:#faecea;color:#9b3e38}</style></head><body><main class="card"><div class="muted">🍽️ Cofradía A Mesa Puesta</div><h1>Crear acceso de administrador</h1><p class="muted">Elige tu contraseña para completar la invitación. El enlace es personal y caduca.</p><form id="form"><div class="field"><label>Correo</label><input id="email" type="email" readonly></div><div class="field"><label>Contraseña</label><input id="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></div><div class="field"><label>Repetir contraseña</label><input id="password2" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></div><button class="btn" id="btn">Crear mi acceso</button></form><div id="msg" class="msg"></div></main><script type="module">const p=new URLSearchParams(location.search),email=p.get("email")||"",token=p.get("token")||"",form=document.querySelector("#form"),msg=document.querySelector("#msg"),btn=document.querySelector("#btn");document.querySelector("#email").value=email;const show=(t,ok=false)=>{msg.textContent=t;msg.className="msg "+(ok?"ok":"bad");msg.style.display="block"};if(!email||!token){form.style.display="none";show("Este enlace de invitación no es válido.")}form.onsubmit=async e=>{e.preventDefault();const a=document.querySelector("#password").value,b=document.querySelector("#password2").value;if(a!==b)return show("Las contraseñas no coinciden.");btn.disabled=true;btn.textContent="Creando acceso…";try{const r=await fetch("https://wmfcpnihymiiwgpvbngj.supabase.co/functions/v1/activar-admin-cofradia",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,token,password:a})}),j=await r.json();if(!r.ok)throw new Error(j.error||"No se pudo crear el acceso");form.style.display="none";show("✓ Acceso creado. Ya puedes entrar en la zona de administración con tu correo y contraseña.",true)}catch(x){show(x.message)}finally{btn.disabled=false;btn.textContent="Crear mi acceso"}};</script></body></html>
